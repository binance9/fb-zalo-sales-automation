<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Sales AI Console</title>
<link rel="stylesheet" href="/style.css?v=4">
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--primary-softer); padding: 20px; }
  .auth-card { width: 380px; background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 32px 30px; }
  .auth-logo { width: 52px; height: 52px; border-radius: 14px; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
  .auth-card h1 { font-size: 19px; text-align: center; margin-bottom: 4px; }
  .auth-card .sub { text-align: center; color: var(--text-light); font-size: 13px; margin-bottom: 22px; }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .form-row input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border-gray); border-radius: 10px; outline: none; }
  .form-row input:focus { border-color: var(--primary); }
  .auth-err { background: var(--red-soft); color: var(--red); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; display: none; }
  .btn-login { width: 100%; padding: 11px; background: var(--primary); color: #fff; border-radius: 10px; font-weight: 700; font-size: 15px; }
  .btn-login:hover { background: var(--primary-dark); }
  .btn-login:disabled { opacity: .55; cursor: wait; }
  .auth-foot { margin-top: 16px; text-align: center; font-size: 13px; color: var(--text-light); }
  .auth-foot a { color: var(--primary-dark); cursor: pointer; text-decoration: underline; }
  .reset-box { display: none; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">

        <option value="vi">VI</option>
        <option value="en">EN</option>
        <option value="zh">中文</option>
        <option value="ko">한국어</option>

    </div>
    <h1>Sales AI Console</h1>
    <div class="sub" data-i18n="lg.sub">Bán hàng tự động — đăng nhập để vận hành</div>

    <div id="authErr" class="auth-err"></div>

    <!-- Đăng nhập -->
    <div id="loginBox">
      <div class="form-row"><label data-i18n="lg.id">ID đăng nhập</label><input id="email" type="text" placeholder="thao2019" autofocus></div>
      <div class="form-row"><label data-i18n="lg.password">Mật khẩu</label><input id="password" type="password" placeholder="••••••••"></div>
      <button id="btnLogin" class="btn-login" data-i18n="lg.btn_login">Đăng nhập</button>
      <div class="auth-foot"><span data-i18n="lg.forgot">Quên mật khẩu?</span> <a id="linkForgot" data-i18n="lg.reset_link">Đặt lại mật khẩu</a></div>
      <div class="auth-foot" style="margin-top:6px"><span data-i18n="lg.no_acc">Chưa có tài khoản?</span> <a id="linkRegister" data-i18n="lg.reg_link">Đăng ký ngay</a></div>
    </div>

    <!-- Quên mật khẩu (reset token ghi file local — không email thật) -->
    <div id="resetBox" class="reset-box">
      <div class="form-row"><label data-i18n="lg.email">Email đăng ký</label><input id="rEmail" type="email" placeholder="ban@shop.vn"></div>
      <button id="btnForgot" class="btn-login" data-i18n="lg.btn_token">Tạo mã đặt lại</button>
      <div id="resetTokenOut" style="margin-top:12px;font-size:12.5px;color:var(--text-light);word-break:break-all"></div>
      <div class="form-row" style="margin-top:12px"><label data-i18n="lg.reset_code">Mã đặt lại</label><input id="rToken" data-i18n-ph="lg.reset_code_ph" placeholder="dán mã vào đây"></div>
      <div class="form-row"><label data-i18n="lg.new_pass">Mật khẩu mới (tối thiểu 8 ký tự)</label><input id="rPass" type="password"></div>
      <button id="btnReset" class="btn-login" data-i18n="lg.btn_reset">Đặt lại mật khẩu</button>
      <div class="auth-foot"><a id="linkBack" data-i18n="lg.back">← Về đăng nhập</a></div>
    </div>

    <!-- Đăng ký tài khoản mới — mỗi tài khoản 1 cửa hàng riêng -->
    <div id="regBox" class="reset-box">
      <div class="form-row"><label data-i18n="lg.reg_shop">Tên cửa hàng</label><input id="gShop" type="text" data-i18n-ph="lg.reg_shop_ph" placeholder="vd: Nến Scent"></div>
      <div class="form-row"><label data-i18n="lg.reg_id">ID đăng nhập (email)</label><input id="gEmail" type="email" placeholder="ban@shop.vn"></div>
      <div class="form-row"><label data-i18n="lg.reg_pass">Mật khẩu (tối thiểu 8 ký tự)</label><input id="gPass" type="password" placeholder="••••••••"></div>
      <div class="form-row"><label data-i18n="lg.reg_pass2">Nhập lại mật khẩu</label><input id="gPass2" type="password" placeholder="••••••••"></div>
      <button id="btnRegister" class="btn-login" data-i18n="lg.reg_btn">Tạo tài khoản</button>
      <div class="auth-foot"><a id="linkRegBack" data-i18n="lg.back">← Về đăng nhập</a></div>
    </div>
  </div>

    return (pack && pack[k] !== undefined) ? pack[k] : (LG.vi[k] !== undefined ? LG.vi[k] : k);

      el.setAttribute('placeholder', window.t(el.getAttribute('data-i18n-ph')));
    });
    var sel = document.getElementById('langSwitch');
    if (sel) sel.value = cur();
  }
  document.addEventListener('DOMContentLoaded', apply);
  if (document.readyState !== 'loading') apply();
  var sel0 = document.getElementById('langSwitch');
  if (sel0) sel0.addEventListener('change', function () {
    try { localStorage.setItem('sai_lang', sel0.value); } catch (e) { /* bỏ qua */ }
    apply();
  });
})();
const t = k => window.t(k);
const $ = s => document.querySelector(s);
function err(msg) { const e = $('#authErr'); e.textContent = msg || ''; e.style.display = msg ? 'block' : 'none'; }
async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await res.json().catch(() => ({}));
  return { ok: res.ok, j };
}
$('#btnLogin').addEventListener('click', async () => {
  err('');
  const b = $('#btnLogin'); b.disabled = true;
  const r = await post('/api/auth/login', { email: $('#email').value.trim(), password: $('#password').value });
  b.disabled = false;
  if (!r.ok) {
    const map = { RATE_LIMITED: t('lg.err_rate'), BAD_CREDENTIALS: t('lg.err_bad'), UNAUTHORIZED: t('lg.err_unauth') };
    err(map[r.j.error] || (t('lg.err_prefix') + (r.j.error || r.ok)));
    return;
  }
  location.href = '/';
});
$('#password').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnLogin').click(); });
$('#linkForgot').addEventListener('click', () => { $('#loginBox').style.display = 'none'; $('#resetBox').style.display = 'block'; err(''); });
$('#linkBack').addEventListener('click', () => { $('#loginBox').style.display = 'block'; $('#resetBox').style.display = 'none'; err(''); });
$('#linkRegister').addEventListener('click', () => { $('#loginBox').style.display = 'none'; $('#regBox').style.display = 'block'; $('#gEmail').focus(); err(''); });
$('#linkRegBack').addEventListener('click', () => { $('#loginBox').style.display = 'block'; $('#regBox').style.display = 'none'; err(''); });
$('#btnRegister').addEventListener('click', async () => {
  err('');
  const email = $('#gEmail').value.trim(), pass = $('#gPass').value, pass2 = $('#gPass2').value;
  if (pass.length < 8) { err(t('lg.err_weak')); return; }
  if (pass !== pass2) { err(t('lg.err_nomatch')); return; }
  const b = $('#btnRegister'); b.disabled = true;
  const r = await post('/api/auth/register', { email, password: pass, shop_name: $('#gShop').value.trim() });
  b.disabled = false;
  if (!r.ok) {
    const map = {
      RATE_LIMITED: t('lg.err_rate'), BAD_EMAIL: t('lg.err_bademail'), WEAK_PASSWORD: t('lg.err_weak'),
      EMAIL_EXISTS: t('lg.err_exists'),
    };
    err(map[r.j.error] || (t('lg.err_prefix') + (r.j.error || '')));
    return;
  }
  location.href = '/';
});
$('#gPass2').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnRegister').click(); });
$('#btnForgot').addEventListener('click', async () => {
  err('');
  const r = await post('/api/auth/forgot', { email: $('#rEmail').value.trim() });
  if (r.ok && r.j.reset_token) $('#resetTokenOut').textContent = t('lg.token_out') + r.j.reset_token;
  else $('#resetTokenOut').textContent = r.j.sent === false ? t('lg.token_quiet') : '';
});
$('#btnReset').addEventListener('click', async () => {
  err('');
  const r = await post('/api/auth/reset', { token: $('#rToken').value.trim(), new_password: $('#rPass').value });
  if (!r.ok) { err(r.j.error === 'WEAK_PASSWORD' ? t('lg.err_weak') : t('lg.err_token')); return; }
  $('#loginBox').style.display = 'block'; $('#resetBox').style.display = 'none';
  $('#resetTokenOut').textContent = '';
  err(t('lg.ok_reset'));
});
</script>
</body>
</html>
